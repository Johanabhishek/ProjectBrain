name: ProjectBrain CI & Benchmark Gate

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test-and-eval:
    name: Pytest, Anti-Leakage, Wheel Build & Eval Benchmarks
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package with dev dependencies
        run: pip install -e ".[dev]"
      - name: Run full pytest suite (incl. anti-leakage & doc-sync guards)
        run: pytest projectbrain/tests -q
      - name: Run synthetic full-stack precision/recall benchmark
        run: python projectbrain/eval/bench_fullstack.py
      - name: Run core retrieval, graph & claim verification eval
        run: python projectbrain/eval/run_eval.py
      - name: Wheel & sdist packaging smoke check
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: python -m build --outdir dist_check ./projectbrain
