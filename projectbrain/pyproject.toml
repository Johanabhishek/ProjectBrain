[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[project]
name = "projectbrain"
version = "0.1.0"
description = "Codebase intelligence layer for AI coding agents"
requires-python = ">=3.9"
dependencies = [
    "mcp",
    "tree-sitter>=0.23",
    "tree-sitter-python",
    "tree-sitter-javascript",
    "tree-sitter-typescript",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
projectbrain = "projectbrain.cli:main"
projectbrain-mcp = "projectbrain.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
