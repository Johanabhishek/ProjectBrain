[build-system]
requires = ["setuptools>=61.0,<77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "projectbrain-mcp"
version = "0.2.3"
description = "Surgical AST Context Compiler, Closed-World Dossier & Anchor Patch Engine for AI Coding Agents (-75% to -88% tokens)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
keywords = ["ai", "agents", "mcp", "ast", "tree-sitter", "context-compression", "code-graph", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Software Development :: Compilers",
]
dependencies = [
    "mcp",
    "tree-sitter>=0.23",
    "tree-sitter-python",
    "tree-sitter-javascript",
    "tree-sitter-typescript",
]

[project.optional-dependencies]
dev = ["pytest>=7", "build", "twine"]

[project.scripts]
projectbrain = "projectbrain.cli:main"
projectbrain-mcp = "projectbrain.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
