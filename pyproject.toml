[build-system]
requires = ["setuptools>=61.0,<77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "projectbrain-mcp"
version = "0.9.0"
description = "Local SQLite Code Graph, Multi-Dimensional AST/PDG Slicer, and Syntax-Verified Symbol Patcher for AI Coding Agents"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = [
    "ai",
    "agents",
    "mcp",
    "ast",
    "tree-sitter",
    "context-compression",
    "code-graph",
    "sqlite",
    "fts5",
    "static-analysis",
    "llm",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Software Development :: Compilers",
]
dependencies = [
    "mcp>=1.2.0,<2.0.0",
    "tree-sitter>=0.23",
    "tree-sitter-python",
    "tree-sitter-javascript",
    "tree-sitter-typescript",
    "tree-sitter-go",
    "tree-sitter-rust",
    "tree-sitter-java",
]

[project.optional-dependencies]
dev = ["pytest>=7", "build", "twine"]

[project.scripts]
projectbrain = "projectbrain.cli:main"
projectbrain-mcp = "projectbrain.server:main"

[tool.setuptools.packages.find]
where = ["projectbrain/src"]

[tool.pytest.ini_options]
testpaths = ["projectbrain/tests"]
