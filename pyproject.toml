[build-system]
requires = ["setuptools>=61.0,<77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "projectbrain-mcp"
version = "1.4.0"
description = "Zero-LLM Cross-Stack Contract Firewall, Satellite Coordinate Router & PR Architecture Guardrail for AI-Generated Code (CLI, CI SARIF & MCP)"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
keywords = [
    "ai",
    "agents",
    "mcp",
    "ast",
    "tree-sitter",
    "context-compression",
    "code-graph",
    "sqlite",
    "fts5",
    "static-analysis",
    "llm",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Software Development :: Compilers",
]
dependencies = [
    "mcp>=1.2.0,<2.0.0",
    "tomli>=2.0; python_version < '3.11'",
    "tree-sitter>=0.23",
    "tree-sitter-python",
    "tree-sitter-javascript",
    "tree-sitter-typescript",
    "tree-sitter-go",
    "tree-sitter-rust",
    "tree-sitter-java",
]

[project.optional-dependencies]
dev = ["pytest>=7", "build", "twine"]

[project.urls]
Homepage = "https://johanabhishek.github.io/projectbrain-docs/"
Documentation = "https://johanabhishek.github.io/projectbrain-docs/"
Repository = "https://github.com/Johanabhishek/ProjectBrain"
Issues = "https://github.com/Johanabhishek/ProjectBrain/issues"

[project.scripts]
projectbrain = "projectbrain.cli:main"
projectbrain-mcp = "projectbrain.server:main"

[tool.setuptools.packages.find]
where = ["projectbrain/src"]

[tool.pytest.ini_options]
testpaths = ["projectbrain/tests"]
